# Configuração do projeto Cloudflare Pages deste site.
#
# O database_id identifica o banco na conta Cloudflare; não é credencial e
# sozinho não dá acesso a nada — quem autentica é o token do wrangler.

name = "onde-tem-sus"
compatibility_date = "2026-08-25"
pages_build_output_dir = "web"

[[d1_databases]]
binding = "DB"                       # nome usado no código: env.DB
database_name = "mapa-sus-reports"
database_id = "d24b75c5-33de-4f60-a2a4-16eeaa0cc6da"

[[r2_buckets]]
binding = "EVIDENCIAS"               # nome usado no código: env.EVIDENCIAS
bucket_name = "mapa-sus-evidencias"  # criar com: wrangler r2 bucket create mapa-sus-evidencias
